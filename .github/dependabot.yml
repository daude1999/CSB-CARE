version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 10
    groups:
      # Minor and patch updates arrive as one PR a week; major versions come one at a time for review.
      npm-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies]
