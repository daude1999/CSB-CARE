# Local or single-host deployment. For production on Azure see docs/DEPLOYMENT.md.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: csb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: csb
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csb"]
      interval: 5s
      retries: 20

  migrate:
    build: .
    command: migrate
    env_file: .env
    environment:
      DATABASE_URL: postgresql://csb:${POSTGRES_PASSWORD:-change-me}@db:5432/csb?schema=public
    depends_on:
      db: { condition: service_healthy }

  web:
    build: .
    command: web
    env_file: .env
    environment:
      DATABASE_URL: postgresql://csb:${POSTGRES_PASSWORD:-change-me}@db:5432/csb?schema=public
      STORAGE_LOCAL_DIR: /app/.data/storage
    ports: ["3000:3000"]
    volumes: [storage:/app/.data]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    build: .
    command: worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://csb:${POSTGRES_PASSWORD:-change-me}@db:5432/csb?schema=public
      STORAGE_LOCAL_DIR: /app/.data/storage
    volumes: [storage:/app/.data]
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
  storage:
