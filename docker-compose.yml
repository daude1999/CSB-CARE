# Optional: PostgreSQL 16 for local use, instead of installing it (`docker compose up -d db`).
# Matches the default DATABASE_URL in .env.example. Local use only; data is kept in the csb-pgdata volume.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: csb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - csb-pgdata:/var/lib/postgresql/data
      - ./scripts/docker-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
volumes:
  csb-pgdata:
